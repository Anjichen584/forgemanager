# ---- PlaceholderAPI 桥（拓展第一档）----
# 装了 PlaceholderAPI 且 enabled=true 时，反射挂载 %forgemaster_*% 占位符：
#   coins / reputation / title / top_quality / top_score / strengthen / forge_count / forbidden
# 没装 PAPI 时整段静默跳过，不影响其它功能。
placeholder:
