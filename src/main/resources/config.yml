# ============================================================
#  匠衔段位（v2.0 · B4）
#  赛季制：段位按依据值划档，只在赛季内升不降；跨季时回落 season-fall 档。
#  tiers 按 min 升序，min 为依据值的下限。
# ============================================================
craft-rank:
  enabled: true                  # 是否开启匠衔段位
  basis: reputation              # 划档依据：reputation（声望） / level（专精等级）
  season-fall: 1                 # 赛季切换时回落几档（0 = 不回落）
  broadcast: true                # 跨档时是否全服广播
  tiers:
    - name: 学徒
      min: 0
    - name: 匠人
      min: 100
    - name: 宗师
      min: 300
    - name: 大匠
      min: 800
    - name: 铸剑圣手
      min: 2000

# ---- 拍卖行（A3）----
auction:
  # 是否开启拍卖行
  enabled: true
  # 抽成比例：卖家到手 = 成交价 - 成交价 × 抽成（向下取整），抽成部分销毁
  tax-rate: 0.05
  # 单件拍品最高价（剑币）
  max-price: 1000000
  # 每次加价至少多少剑币
  min-increment: 10
  # 挂单默认时长（小时）与最长时长
  default-hours: 24
  max-hours: 72
  # 每人同时挂单上限
  max-per-player: 5
  # 挂单手续费（剑币，0 = 免费）
  listing-fee: 0

# ---- 锻造订单（玩家对玩家委托市场）----
# /zhujian order（别名 dingdan）：主手拿锻造品做样品发单，悬赏剑币现扣托管；
# 别人接单做出达标的剑交付，剑走拍卖行邮箱给发单人，悬赏（扣手续费）给接单人。
order:
  enabled: true
  # 同一发单人同时最多的活跃订单数（挂出中 + 已接单）
  max-active-per-player: 3
  # 订单多少小时没交付就过期（悬赏退发单人，剑若已收退接单人邮箱）
  expire-hours: 72
  # 交付成功给接单人的声望小奖励（与系统委托同款口径）
  rep-reward: 10
  # 手续费比例：接单人到手 = 悬赏 - floor(悬赏 × fee-rate)。
  # 手续费直接销毁（不进任何账户）——这是剑币的回收口，与拍卖行 tax-rate 同语义。
  fee-rate: 0.05
  # 单张订单悬赏上限复用上面的 auction.max-price，不在此重复设键。

# ---- 经济：拍卖抽成 ----
# 成交价扣掉 floor(成交价 × tax-rate) 后给卖家，抽成部分销毁。
# 商店单价不在这里，看上面 shop.materials（按材料 + 档次定价）。

# ---- 收藏图鉴（拓展第一档）----
# /zhujian collection|shoucang|tujian 打开。六类收藏：品质 / 剑型 / 评分里程碑 / 圣物 / 词条种类 / 剑灵命名。
# 品质与评分从 data.yml 的既有统计（by-quality / best-score）推导；圣物直接读龙税契约 run.relics；
# 词条种类与剑灵命名在「锻造结算 / 重铸出词条 / 剑灵命名」三处登记，进度存 codex-data.yml。
codex:
  enabled: true
  # 每完成一个分类的奖励剑币（rewards 里按分类覆盖）
  reward-per-category: 500
  rewards:
    quality: 600
    form: 400
    score: 800
    relic: 1000
    affix: 800
    spirit: 300
  # 全图鉴收集的额外奖励剑币
  all-reward: 2000
  # 全收集称号（GUI 与广播文案用）
  all-title: "图鉴宗师"

# ============================================================
#  名剑谱（拓展第二档）
#  /zhujian spectrum|mingjian|pu 打开。给顶级神兵绑锻造任务线：
#  条件全部由既有统计与档案推导（StatsStore 统计 / 图鉴 codex / 本模块登记的
#  剑冢胜场与最高锻阶），不扫描背包。奖励一次性领取，已领记录在 spectrum-data.yml。
#
#  条件 DSL（Java 只认下面 5 种 type，写别的永远不满足）：
#    material         持有（曾锻出）指定材料的剑 —— 读 data.yml 图鉴 codex（材料:品质）
#    strengthen-level 历史最高强化等级 —— 读 data.yml best-strengthen
#    evolution-stage  历史最高锻阶（蜕变阶）—— 蜕变成功结算处登记，存 spectrum-data.yml
#    quality          曾锻出指定品质及以上 —— 读 data.yml by-quality
#    stat             通用统计键 min 阈值 —— 读 StatsStore 公开档案（forged / commissions /
#                     duel-wins / tombs / spirits / flawless / reputation / level 等），
#                     另有 tomb-wins = 剑冢残影胜场（由胜利结算登记）
# ============================================================
spectrum:
  enabled: true
  # 已解锁特型（weight 0 的剑型）在后续锻造时被抽中的概率
  special-form-chance: 0.30
  entries:
    yuehen:
      display: "星陨·月痕"
      icon: NETHERITE_SWORD
      lore:
        - "<gray>以星陨之钢，铸一轮弯月。"
        - "<dark_gray>星陨为骨，蜕变为魂。"
      conditions:
        - { type: material, id: starfall }
        - { type: strengthen-level, min: 40 }
        - { type: evolution-stage, min: 3 }
        - { type: quality, id: EPIC }
      rewards:
        form: yuehen            # 专属剑型（weight 0，只能从这里解锁）
        title: "铸月者"
        coins: 20000
    qianchui:
      display: "百炼·千锤"
      icon: ANVIL
      lore:
        - "<gray>五百炉火，锤锤见真章。"
      conditions:
        - { type: stat, key: forged, min: 500 }
      rewards:
        form: qianchuiwen       # 专属剑型（weight 0，只能从这里解锁）
        coins: 8000
    shouzhongren:
      display: "葬剑·守冢人"
      icon: SKELETON_SKULL
      lore:
        - "<gray>斩下十道残影，剑冢认你为守冢人。"
      conditions:
        - { type: stat, key: tomb-wins, min: 10 }
      rewards:
        tomb-fee-discount: 0.5  # 剑冢挑战费 5 折
        coins: 12000

# ------------------------------------------------------------
# 称号扩展（v2.18.0）：config 驱动解锁 + 手动佩戴，/zhujian title 打开面板
#   优先级：手动佩戴 > 声望称号（StatsStore.titleOf）；聊天前缀经 %forgemaster_title% 渲染
#   condition.type 与名剑谱同口径，只认 5 种：
#     material          —— 曾锻出过某材料的剑（id = 材料 id，读图鉴 codex）
#     strengthen-level  —— 历史最高强化等级（min）
#     evolution-stage   —— 历史最高锻阶（min）
#     quality           —— 曾锻出过某品质（id = 品质名，如 MYTHIC）
#     stat              —— StatsStore 统计键（key = forged/tombs/spirits/reputation/... ，min = 目标）
#   解锁状态从档案实时推导（统计只涨不跌），不需要单独落盘；只有「佩戴哪个」存玩家 PDC
#   注：内置 5 条示例全部用现有统计键落地——行会贡献不在 StatsStore 里，不发明新统计
# ------------------------------------------------------------
titles:
  - id: first-mythic
    display: "首把神话"
    color: "#ff3d6e"
    icon: NETHERITE_SWORD
    condition: { type: quality, id: MYTHIC, min: 1 }
  - id: plus-ninety-nine
    display: "+99 达成"
    color: "#ffd166"
    icon: ANVIL
    condition: { type: strengthen-level, min: 99 }
  - id: thousand-hammers
    display: "千锤百炼"
    color: "#b06bff"
    icon: IRON_BLOCK
    condition: { type: stat, key: forged, min: 1000 }
  - id: tomb-keeper
    display: "剑冢守墓人"
    color: "#8d8d8d"
    icon: SKELETON_SKULL
    condition: { type: stat, key: tombs, min: 50 }
  - id: risk-taker
    display: "险中求胜"
    color: "#4ee36b"
    icon: TNT
    condition: { type: stat, key: risk-made, min: 100 }

# ---- 战力评分（v2.23 切片 5 · D）----
# power = 基础(品质×材质) × 强化 × 蜕变 × 词条 × 宝石 × 剑灵
# 所有系数都在这里，改完 /zhujian reload 立刻生效；/zhujian power 可看手持剑的拆解。
# 默认值只是「能跑起来」的保守初值 —— 路线图 §六 要求等切片 1-3 跑两周、
# 看清「什么配置的剑真的有人抢」之后再按真实成交校准，别拍脑袋。
power-score:
  # 关掉后：/zhujian power 仍可用，但拍卖/订单不再显示推荐价
  enabled: true
  base-multiplier: 100.0          # 基础分倍率：品质 power()（粗糙0.5…神话5.0）× 材质加成 × 本值
  material-per-tier: 0.12         # 材质每高一档，基础分 +12%（档 1 = 无加成）
  strengthen-per-level: 0.055     # 每强化 +1 级，系数 +5.5%
  strengthen-cap: 8.0             # 强化系数上限（防 +99 一把压死全服）
  evolve-per-stage: 1.35          # 每蜕变一阶，系数乘 1.35（复利，蜕变不可逆所以给得比强化高）
  affix-fallback: 0.06            # 未知词条 id（服主自定义）的默认贡献
  affix-weights:                  # 按词条 id 定权重；没列到的走 affix-fallback
    attack: 0.10
    speed: 0.07
    armor: 0.09
    toughness: 0.08
    crit: 0.12
    lifesteal: 0.11
    fire: 0.06
    armor_plate: 0.10
    tough_plate: 0.09
  gem-per-point: 0.004            # 每点宝石数值的系数贡献
  gem-grade-weight: 0.15          # 宝石品质每高一级，该颗宝石贡献再 +15%
  enchant-per-level: 0.03         # 附魔孔每级附魔的系数贡献
  spirit-weight: 0.30             # 灵性饱满时最多 +30%
  # 推荐价：战力 × 单价（取整到 10 的倍数，低于下限按下限）
  suggest-price: true
  price-per-power: 2.5
  price-min: 100
  # 评级分界：加档只要在这里新增一段，不用改代码
  grades:
    fanpin:   { min: 0,     label: "凡品" }
    liangpin: { min: 600,   label: "良品" }
    shangpin: { min: 1400,  label: "上品" }
    juepin:   { min: 3000,  label: "绝品" }
    shenpin:  { min: 6000,  label: "神品" }