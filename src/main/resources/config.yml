# ------------------------------------------------------------
# 词条数值按材料档位缩放
#   低档材料（铁 / 金）词条基础值低、随机波动也小；
#   档位越高，基准越高、波动越宽，能出极品也能出平庸货。
#   value  数值倍率：该档词条的基准倍数
#   spread 波动倍率：该档词条的上下浮动半宽倍数
#   最终值 = (min+max)/2 × value ± (max-min)/2 × spread
# ------------------------------------------------------------
affix-scaling:
  enabled: true
  tiers:
    1: { value: 0.50, spread: 0.40 }   # 铁 / 金：低且稳
    2: { value: 0.70, spread: 0.60 }   # 铜
    3: { value: 1.00, spread: 1.00 }   # 钻石（基准）
    4: { value: 1.30, spread: 1.25 }   # 下界合金
    5: { value: 1.65, spread: 1.55 }   # 星陨：高且飘

