# ---- 师徒系统（v2.0，w5-mentor）----
# 拜师：/zhujian master 玩家名 发邀请，对方 /zhujian accept 收徒
# 分成：只在徒弟锻造成功时结算；师父离线也入账（只要仍是绑定关系）
# 加成：师父在线时，徒弟加热容差额外乘 (1 + apprentice-tolerance-bonus)
mentor:
  # 总开关
  enabled: true
  # 一个师父最多带几个徒弟（一人只能有一个师父）
  max-disciples: 3
  # 拜师邀请多少秒内有效（仅内存，重启失效）
  invite-expire-seconds: 60
  # 解除师徒关系后，徒弟多少小时内不能再拜师（0 = 无冷却）
  unbind-cooldown-hours: 24
  # 徒弟每锻成一把剑，师父分得徒弟本次剑币收益的比例（0.10 = 10%，向上取整至少 1 币）
  coin-share-rate: 0.10
  # 师父在线时，徒弟高温容差的额外加成（0.05 = +5%，叠加在专精容差之上，上限 50%）
  apprentice-tolerance-bonus: 0.05
  # ---- 出师（v2.18.0）----
  # 徒弟 /zhujian master graduate 预约、graduate-confirm 确认（两步确认防误触）
  graduation:
    # 出师条件（全部从档案/强化履历推导，不扫背包；配 0 = 关闭该项）
    min-forged: 100            # 累计锻造次数
    min-reputation: 200        # 声望
    min-strengthen: 20         # 历史最高强化等级（只涨不跌）
    min-evolution-stage: 2     # 历史最高锻阶（蜕变成功登记）
    # 预约到确认的间隔上限（秒），超时要重新预约
    confirm-seconds: 30
    # 徒弟出师奖励：coins = 剑币；charm = 符（id: talisman 护胚 / steady 稳胚 / charm-kindle 旺火，amount 数量）
    apprentice-reward:
      coins: 500
      charm: { id: steady, amount: 2 }
    # 师父奖励（徒弟在线发符，离线只入账剑币）；出师即分成终止，这是给师父的补偿
    master-reward:
      coins: 300
      charm: { id: charm-kindle, amount: 1 }

# ------------------------------------------------------------
# 行会商会（拓展第三档 · 社交层）：玩家自建行会，共担金库、共享锻造加成
#   存档 guild-data.yml；一人一会；退会 24h 冷却；会长退会 = 解散（金库平分退还）
# ------------------------------------------------------------
guild:

  # ---- 行会仓库 / 行会委托（v2.23）----
  warehouse:
    rows: 3                  # 仓库行数（1~6），容量 = rows×9
    member-withdraw: false   # 普通成员能否取出（会长永远全权）
  quest:
    enabled: true            # 行会协作委托总开关
    type: alternate          # forge / strengthen / random / alternate（轮流）
    cycle-hours: 24          # 周期；24 = 对齐本地 0 点刷新
    forge-target: 10         # 集体锻剑目标（把）
    strengthen-target: 15    # 集体强化目标（总等级）
    reward-base: 100         # 每人基础剑币
    reward-per-member: 0.1   # 人数系数：奖励 = base×(1+(人数-1)×系数)
    poll-seconds: 300        # 进度轮询间隔（秒，下限 60）
    report-daily-cap: 5      # 每成员每周期会长上报上限
    report-max: 3            # 单次上报数量上限
  # 总开关
  enabled: true
  # 一个行会最多几名成员（含会长）
  max-members: 8
  # 会名最长几字（玩家自起，全服唯一）
  name-max-chars: 8
  # 入会邀请多少秒内有效（仅内存，重启失效）
  invite-expire-seconds: 60
  # 退会 / 被踢后多少小时内不能再建会或入新会（0 = 无冷却）
  leave-cooldown-hours: 24
  # 锻造剑币加成，按成员数取最高档（乘在 CoinRules 锻造奖励上，不叠加只取高）
  bonus:
    tier1: { members: 3, rate: 0.05 }   # ≥3 人：每人锻造剑币 +5%
    tier2: { members: 5, rate: 0.10 }   # ≥5 人：每人锻造剑币 +10%
  # 行会周赛：每周（世界时间 7 个游戏日）自动汇总各会成员当周锻造积分（粗糙炸剑不算），
  # 榜首行会全员广播，会长领下面的奖励；巡检低频（每小时查一次跨周）
  week-first-prize: 500        # 冠军行会会长领的剑币
  week-check-hours: 1          # 每隔多少小时巡检一次世界周
  # 金库扩容（金库唯一消耗出口）：会长花金库扩成员上限
  upgrade-cost: 2000
  upgrade-size: 2              # 每次扩容 +2 人
  upgrade-max: 3               # 最多扩 3 次
  # ---- 商会基金与科技（v2.24 切片二）----
  # 成员 /zhujian guild fund donate <数量> 向基金捐剑币（wallet 收口，只进不退，退会不退款）；
  # 会长 /zhujian guild tech buy <techId> 花基金升级科技，价格逐级递增：
  # 第 L→L+1 级 = cost-base + cost-per-level × L。
  # 科技两条线各 max-level 级封顶（代码硬上限 5）：
  #   forge-discount  锻造费 -2%/级（代码上限 10%）
  #   forge-success   锻造成功率 +1%/级（代码上限 5%）
  # 效果查询口：GuildService.forgeFeeMultiplier(uuid) / forgeSuccessBonus(uuid)
  # （ForgeManager 落点一行调用，收口时接入）
  tech:
    cost-base: 2000            # 1 级价格
    cost-per-level: 1500       # 每级递增
    max-level: 5               # 科技等级上限（代码硬上限 5）
    discount-per-level: 0.02   # forge-discount 每级锻造费折扣
    success-per-level: 0.01    # forge-success 每级成功率加成

# ------------------------------------------------------------
# 声望兑换所（v2.24 切片二）：/zhujian redeem（别名 duihuan / huan）
# 声望换剑币与保底护胚类符；扣减走 StatsStore.spendReputation（不足拒付），
# 发钱走 Wallet 收口，不新开账本。
# ------------------------------------------------------------
redeem:
  coin-rate: 10          # 1 声望 = 10 剑币
  coin-max: 500          # 单次最多兑换的声望数
  charms:                # 可兑换的符 → 各自声望价（id 用 Charm 标准小写 id）
    talisman: 40         # 护胚符
    steady: 60           # 稳胚符

# ------------------------------------------------------------
# 环境修正（w7-env）：天气 + 时辰，开局时固化进 EnvContext，整局使用同一份
#   heat      加热保温修正（正=降温更慢，负=降温更快），按 1 - heat 乘散热速度
#   quench    淬火收益修正（倍率，0.10 = 淬火收益 +10%）
#   fold      叠钢时长修正（秒，正=多给时间）
#   grind     开刃绿区宽度修正（同量纲于开刃宽度，正=更宽）
#   天气与时辰的修正会相加后一起生效
# 时辰按世界时间（tick，0-23999）划分：
#   黎明 23000~1000 ｜ 白天 1000~12000 ｜ 黄昏 12000~13000 ｜ 夜晚 13000~23000
# ------------------------------------------------------------
environment:
  # 总开关：关闭后所有修正为 0，且不显示环境提示
  enabled: true
  # 开局是否在聊天栏与 ActionBar 提示当前天气、时辰与修正
  announce-on-start: true

  weather:
    # 雷雨（世界正在打雷）：淬火收益 +10%，叠钢多 0.3 秒，开刃绿区 +0.3
    storm:
      label: "雷雨"
      heat: 0.0
      quench: 0.10
      fold: 0.3
      grind: 0.3
    # 雨（世界在下雨）：加热降温快 5%，淬火收益 +3%
    rain:
      label: "雨"
      heat: -0.05
      quench: 0.03
      fold: 0.0
      grind: 0.0
    # 晴朗：无修正
    clear:
      label: "晴朗"
      heat: 0.0
      quench: 0.0
      fold: 0.0
      grind: 0.0

  time:
    # 黎明：保温 +6%（炉子降温更慢，好趁热加热）
    dawn:
      label: "黎明"
      heat: 0.06
      quench: 0.0
      fold: 0.0
      grind: 0.0
    # 白天：无修正
    day:
      label: "白天"
      heat: 0.0
      quench: 0.0
      fold: 0.0
      grind: 0.0
    # 黄昏：无修正
    dusk:
      label: "黄昏"
      heat: 0.0
      quench: 0.0
      fold: 0.0
      grind: 0.0
    # 夜晚：淬火收益 +6%，开刃绿区 +0.5（夜里手稳）
    night:
      label: "夜晚"
      heat: 0.0
      quench: 0.06
      fold: 0.0
      grind: 0.5

# ------------------------------------------------------------
# 商会（w2-shop）：用剑币购买原料与剑胚图纸，/zhujian shop 打开
#   enabled      总开关
#   batch-size   左键一次买几个原料（右键永远买 1 个），1~64
#   materials    原版材料名(小写) → 各档单价（剑币）；没写的档次不卖
#                档次键：common 普通料 / refined 精炼料 / celestial 天外料
#   blueprints   剑胚 id → 图纸单价（剑币）；没写的剑胚不卖图纸
# 价格每次打开商会时现读，/zhujian reload 后立即生效。
# ------------------------------------------------------------
shop:
  enabled: true
  batch-size: 8
  # 特殊道具（逐个买，不按批发）
  specials:
    talisman: 1500          # 护胚符：强化失败本该碎剑胚时顶一次
    steady: 2000            # 稳胚符：强化失败不掉级
    charm-kindle: 2500      # 旺火符：本次强化成功率 +15 个百分点
  materials:
    # 铁锭
    iron_ingot: {common: 20, refined: 60, celestial: 180}
    # 金锭
    gold_ingot: {common: 20, refined: 60, celestial: 180}
    # 铜锭
    copper_ingot: {common: 25, refined: 70, celestial: 200}
    # 钻石
    diamond: {common: 60, refined: 160, celestial: 420}
    # 下界合金锭
    netherite_ingot: {common: 150, refined: 400, celestial: 1000}
  blueprints:
    # 剑胚 id: 图纸单价（剑币）
    iron: 120
    gold: 150
    copper: 240
    diamond: 360
    netherite: 560
    starfall: 800

# ------------------------------------------------------------
# 黑市（轻量留存拓展）：/zhujian blackmarket（别名 heishi）
#   每个服务器「现实日」（服务器本地时区，不用主世界 dayTime——MC 昼夜只有 20 分钟
#   真实时间，用 dayTime 会一天换几十批）从下面 pool 里按权重随机抽 size 件上架，
#   价格在 discount-min ~ discount-max 之间随机打折；种子 = 日期 + 主世界名，
#   同一天全服看到同一批货、同一批价。每人每件每天限购 daily-limit 次，
#   已购次数存 daily-data.yml。只卖消耗型（符 / 锻造原料 / 图纸），
#   武器装备材质会被自动剔除。购买走 economy 经济口径（外部经济优先，退回剑币）。
#   pool 条目格式（同 events.schedule 的行内 map 风格）：
#     { type: charm,     id: talisman,  price: 1500 }              # 符：talisman/steady/charm-kindle
#     { type: material,  id: iron_ingot, grade: refined, price: 60, weight: 3 }   # 锻造原料（grade 可选，默认 common）
#     { type: blueprint, id: starfall,  price: 800 }               # 剑胚图纸（id = 剑胚 id）
#     weight 可选，默认 1；price = 原价（剑币），实际售价再乘当日折扣
# ------------------------------------------------------------
blackmarket:
  enabled: true
  size: 4                    # 每天上架几件
  discount-min: 0.55         # 折扣下限（0.55 = 最低打到 55% 价）
  discount-max: 0.8          # 折扣上限
  daily-limit: 2             # 每人每件每天限购次数
  pool:
    - { type: charm, id: talisman, price: 1500, weight: 3 }
    - { type: charm, id: steady, price: 2000, weight: 3 }
    - { type: charm, id: charm-kindle, price: 2500, weight: 2 }
    - { type: material, id: iron_ingot, grade: common, price: 20, weight: 4 }
    - { type: material, id: iron_ingot, grade: refined, price: 60, weight: 3 }
    - { type: material, id: gold_ingot, grade: refined, price: 60, weight: 3 }
    - { type: material, id: copper_ingot, grade: common, price: 25, weight: 4 }
    - { type: material, id: diamond, grade: refined, price: 160, weight: 2 }
    - { type: material, id: netherite_ingot, grade: common, price: 150, weight: 1 }
    - { type: blueprint, id: iron, price: 120, weight: 2 }
    - { type: blueprint, id: gold, price: 150, weight: 2 }
    - { type: blueprint, id: diamond, price: 360, weight: 1 }
    - { type: blueprint, id: starfall, price: 800, weight: 1 }

# ------------------------------------------------------------
# 每日签到（轻量留存拓展）：/zhujian signin（别名 qiandao）
#   每天首次签到领 rewards 里的一档，7 天一轮递增，第 7 项是大奖。
#   断签不清零：只记「本轮内已签天数」，隔天没签不前进也不清零，下次接着领下一档；
#   领完最后一档后回到第 1 档开新一轮。日期按服务器本地时区的现实日计（同黑市）。
#   奖励字段（同 season-pass 的 reward 格式）：coins 剑币 / charm 符 id /
#   charm-amount 符数量 / material 材料或剑胚 id / material-amount 数量，均可选。
#   进度存 daily-data.yml（与黑市共用）。
# ------------------------------------------------------------
daily:
  enabled: true
  rewards:
    - { coins: 200 }                                        # 第 1 天
    - { coins: 300 }
    - { coins: 400, charm: talisman, charm-amount: 1 }      # 第 3 天：护胚符
    - { coins: 600 }
    - { coins: 800, material: iron_ingot, material-amount: 8 }
    - { coins: 1200, charm: steady, charm-amount: 1 }       # 第 6 天：稳胚符
    - { coins: 2500, charm: charm-kindle, charm-amount: 2 } # 第 7 天：大奖（旺火符 ×2）

# ------------------------------------------------------------
# 图纸（v2.3）：商会卖的《图纸 · XX》终于有用了
#   开工时背包里有对应剑胚的图纸 → 加热容差加成；开启 required 后没图纸不能造
# ------------------------------------------------------------
blueprint:
  enabled: true
  required: false          # true = 必须先买图纸才能锻造该剑胚
  consume: true            # 每打一把消耗 1 张
  tolerance-bonus: 0.15    # 持图纸锻造时加热容差 +15%

# ------------------------------------------------------------
# 极限锻造 RISK（w2-shop · D3）：/zhujian forge risk 预设下一把剑
#   enabled                开关
#   hammer-interval-ticks  锻打指针走一格的间隔（tick），越小越快，原版默认约 3
#   zone-shrink            命中区半径缩窄格数
#   score-bonus-percent    成功分数加成百分比（35 = 总分 ×1.35）
#   explode-chance         每个阶段结束时炸剑的概率（0~0.95）
# 炸剑：材料全失，计入 riskLost，连锻断链；成品打 RISK_MADE 标记并计入 riskMade。
# ------------------------------------------------------------
risk:
  enabled: true
  hammer-interval-ticks: 2
  zone-shrink: 1
  score-bonus-percent: 35
  explode-chance: 0.06

# ------------------------------------------------------------
# 世界事件（w2-shop · D4）：定时随机或管理员手动开启，期间在玩家附近空投稀有材料并全服公告
#   enabled                  总开关
#   interval-minutes         随机开启的检查间隔（分钟，无事件时计时）
#   duration-seconds         单场持续时长（秒）
#   spawn-interval-seconds   空投间隔（秒）
#   spawn-radius             空投落点距玩家的半径（格）
#   drops-per-player         每轮每位在线玩家空投几份
#   max-active-drops         场上空投物上限，防止刷爆实体
#   types.<id>.drops         掉落表：item 材料，grade 档次，weight 权重，min/max 数量
# 手动：/zhujian event start <id>（管理员）；/zhujian event stop；/zhujian event 看状态
# ------------------------------------------------------------
events:
  enabled: true
  interval-minutes: 60
  duration-seconds: 180
  spawn-interval-seconds: 15
  spawn-radius: 12
  drops-per-player: 1
  max-active-drops: 60
  # 事件轮换表（拓展第二档骨架）：按权重随机挑一个开。整段删除 = 回到旧行为（types 里均匀随机）。
  # type 可写 types 里的任意 id；starfall 是「星陨」的别名（= meteor）；dragon-tide 本版只做全服公告占位
  # （契约税额乘数 contract.tax.event-multiplier 暂未接入 ContractManager 结算，见 contract.tax 注释）。
  # 改这里要重启（或重载插件）才生效。
  schedule:
    - { type: starfall, weight: 6 }
    - { type: dragon-tide, weight: 2 }
  types:
    meteor:
      display: "陨星降临"
      announce-start: "<#ffd166>天空裂开了一道火痕——陨星降临！<gray>快去附近找找落下的星材。"
      announce-end: "<gray>陨星的火光散去了。"
      drops:
        starfall:
          item: NETHER_STAR
          grade: celestial
          weight: 3
          min: 1
          max: 1
        diamond:
          item: DIAMOND
          grade: refined
          weight: 5
          min: 1
          max: 2
        iron:
          item: IRON_INGOT
          grade: common
          weight: 7
          min: 2
          max: 4
    veins:
      display: "矿脉涌现"
      announce-start: "<#7ef2c8>大地涌出了成片的矿脉！<gray>附近的矿石正在等你。"
      announce-end: "<gray>矿脉重新沉入地下。"
      drops:
        copper:
          item: COPPER_INGOT
          grade: common
          weight: 6
          min: 2
          max: 5
        gold:
          item: GOLD_INGOT
          grade: refined
          weight: 3
          min: 1
          max: 3
        netherite:
          item: NETHERITE_INGOT
          grade: celestial
          weight: 1
          min: 1
          max: 1
    dragon-tide:
      display: "龙潮再临"
      # 占位事件：只有公告、没有 drops（空投逻辑会自动跳过）。
      # 下一版接入契约税额乘数（contract.tax.event-multiplier）后才影响龙税结算。
      announce-start: "<#b06bff>深海的潮声变成了龙吟——龙潮再临！<gray>在契的匠人留意今晚的贡品。"
      announce-end: "<gray>龙潮退去，海面恢复了平静。"
# ---- 剑灵（v2.0 · w8）----
# 成品养灵：击中敌人与花剑币喂养都会增加灵性，跨档解锁特效并刻入灵契词条。
spirit:
  enabled: true
  pvp: false                      # 是否统计 PVP 命中养灵（默认关：互砍可以无限刷灵性）                  # 是否开启剑灵系统
  max: 1000                      # 灵性上限
  gain-per-hit: 1                # 每次击中敌人增加的灵性
  feed-coin-cost: 10             # 喂养一次消耗的剑币
  feed-spirit: 30                # 喂养一次增加的灵性
  max-extra-affixes: 2           # 灵契词条最多额外几条
  name-max-length: 8             # 剑名最长字符数
  # 灵性档位阈值（从低到高，第一个必须为 0）
  tiers: [0, 50, 150, 400, 900]
  # 各档名称，与 tiers 一一对应
  tier-names: [初醒, 通灵, 凝魄, 化灵, 神器]
  # ---- 剑灵灵击（v2.24 切片二）----
  # 灵性 ≥ min-tier 档（spirit.tiers 第几档起，0 起）的锻造剑击杀时几率「灵体出鞘」：
  # 尸体位置 radius 内的怪物受 damage 点无归因伤害（不触发暴击/吸血/耐久链，
  # 口径同烬狱的「炸怪不炸玩家」），玩家不受伤。每玩家冷却 cooldown-ms。
  # 代码上限：chance≤0.15、damage≤4.0、radius≤3.0、cooldown-ms≥3000、min-tier≥1
  surge:
    enabled: true
    chance: 0.08           # 触发概率
    damage: 2.0            # 每只怪受到的伤害
    radius: 2.5            # 波及半径（格）
    cooldown-ms: 6000      # 每玩家冷却（毫秒）
    min-tier: 3            # 灵性档位下限（第几档起，0 起）
  # ---- 灵契重抽（v2.25 切片二）----
  # 灵性满档的锻造剑可花剑币重抽灵契词条：保留灵性与剑名，按 max-extra-affixes 重掷整批，
  # 旧的灵契从 Lore / 属性 modifier / 聚合 PDC 干净摘除后再抽。每日限 daily-limit 次，
  # 次数记在剑的 PDC 上（跟剑走，换号不重置）。/zhujian spirit reroll [confirm]
  reroll:
    cost: 2000             # 每次重抽费用（剑币，负数按 0 = 免费）
    daily-limit: 1         # 每把剑每天可重抽几次（夹进 [1, 99]）
  # ---- 剑灵显形（拓展第三档）----
  # 灵性达标且已命名的剑在主手玩家肩侧显形为一枚 ItemDisplay 浮游体（绕身环绕）。
  display:
    enabled: true
    min-tier: 3                    # 灵性达到第几档才显形（0 起）
    growth-per-tier: 1.15          # v2.23：显形体随灵性档位长大，每档 ×1.15（1.0 = 关闭成长）
    require-named: true            # 未命名的「无名之剑」不显形——鼓励养成
    orbit-radius: 0.8              # 环绕半径（格），肩侧 0.8
    scale: 0.35                    # 浮游体的迷你展示缩放
    bonus:
      enabled: true                # 显形期间给主手剑加暴击（撤除时差量扣回）
      crit-chance: 0.02            # 暴击率加成（+2%）
# ---- 剑冢（v2.0 · w8）----
# 埋剑入冢，全服可见；其他玩家可付费挑战复刻，成功得剑币与声望，失败扣声望且挑战费不退。
# ---- 剑冢（v1.6 / 残影挑战 v2.7）----
tomb:
  enabled: true                   # 是否开放剑冢
  max-per-player: 5               # 每人最多同时埋几把
  broadcast: true                 # 埋剑时全服广播
  owner-can-retrieve: true        # 埋下的剑主人能否取回（false = 埋了就不能拿回）
  retrieve-fee: 0                 # 取回收取的剑币（0 = 免费）
  challenge-fee: 30               # 每次挑战复刻的剑币（不退）
  challenge-win-coins: 120        # 复刻成功奖励剑币
  challenge-win-reputation: 20    # 复刻成功奖励声望
  challenge-lose-reputation: 5    # 复刻失败扣除声望
  # ---- 冢主温养（v2.24 切片二）----
  # 他人挑战这条剑冢（残影）成功时，冢主埋着的剑 +N 灵性（不超过 spirit.max）。
  # 崩刃剑（broken 留档 / 快照耐久 0）不温养；挑战者与冢主各收一条提示，
  # 全服广播追加「冢主的剑得到了温养 +N」。
  nurture-spirit: 5
  # ---- 残影挑战（v2.7）：把剑冢记录变成一场实战 ----
  # 召唤原剑主人的残影，按原剑的强化等级与品质缩放血量与攻击。
  # /zhujian tomb challenge <编号> 现在走这条路；旧的「配方复刻掷骰」保留为 recipeChallenge() 但不再挂命令。
  challenge:
    enabled: true
    cooldown-hours: 24            # 同一玩家对同一条记录每天一次（0 = 不限）
    cooldown-on-loss: true        # 打输也进冷却
    consume: false                # true = 挑战完销毁记录
    broadcast: true               # 打赢全服播报
    spawn-radius: 3               # 残影生成半径
    leave-radius: 40              # 玩家跑出这个距离算离开
    away-seconds: 60              # 离开/死亡多少秒后回收残影
    level-per-level: 0.08         # 每级强化：血量 +8%
    attack-scale: 0.55            # 原剑攻击折算到残影身上的系数
    sword-base-attack: 6.0        # 折算基准攻击
    max-health: 300               # 血量上限
    max-attack: 40                # 攻击上限
    reward:
      rate-base: 0.40             # 返还材料比例基准
      rate-per-level: 0.02        # 每级强化多返 2%
      rate-max: 0.60              # 返还比例上限
      bonus-chance: 0.15          # 额外掉落概率（宝石 / 护胚符）
      charm-weight: 0.5           # 额外掉落里护胚符的权重
    # 材料档位 → 生物类型；1 铁 / 2 铜 / 3 钻石 / 4 下界合金 / 5 星陨
    mobs:
      1: ZOMBIE
      2: HUSK
      3: WITHER_SKELETON
      4: PIGLIN_BRUTE
      5: WARDEN
  # 成功率 = base-chance × 复刻率 + 专精加成；成功率夹在 [0.05, 0.95]
  base-chance: 0.6               # 复刻率为 1 时的基础成功率
  mastery-bonus-per-level: 0.005 # 每级专精的小幅加成
  mastery-bonus-cap: 0.10        # 专精加成上限（小幅，不喧宾夺主）
  # ---- 配方比对：挑战者主手的剑与埋剑配方逐项对照 ----
  recipe:
    weight-material: 0.30        # 剑胚 id 权重（不同直接 0 分）
    weight-grade: 0.15           # 材料等级权重
    weight-affix: 0.35           # 词条集合权重（忽略顺序，F1 相似度）
    weight-layers: 0.20          # 钢纹层数权重
    grade-step-penalty: 0.5      # 材料等级相差一档扣的分（0~1）
    layer-step-penalty: 0.1      # 钢纹层数每差一层扣的分（0~1）
  # ---- 残页折扣（剑冢秘境扩展）：挑战复刻付费时自动使用 ----
  page-discount-per: 0.10        # 每张残页抵 10% 挑战费
  page-discount-max: 5           # 一次挑战至多用几张残页（0 = 不用残页）

# ---- 残影守卫词缀（v2.23）----
# 剑冢挑战与剑冢秘境的残影守卫随机携带词缀，战斗有差异；PDC 随实体走，死亡自然失效。
tomb-guard-affix:
  enabled: true                 # 总开关：false 时不掷签也不打标记
  pool: [attack_damage, lifesteal, fire, damage_reduce, crit, speed]  # 词缀池（未知 id 自动剔除）
  max-per-guard: 2              # 每只至多几条
  counts: [0.35, 0.40, 0.25]    # 挂 i 条的权重分布（35% 不带 / 40% 一条 / 25% 两条）
  attack-damage: { multiplier: 1.25 }   # 凶戾：残影对玩家伤害 ×1.25
  lifesteal: { fraction: 0.30 }         # 饮血：残影按伤害比例回血
  fire: { seconds: 4 }                  # 灼魂：命中点燃 4 秒
  damage-reduce: { percent: 0.25 }      # 磐石：残影受伤减免 25%
  crit: { chance: 0.20, multiplier: 1.5 }   # 暴烈：概率 ×1.5 暴击
  speed: { level: 1, duration-ticks: 72000 }  # 疾影：移速加快

# ---- 剑冢秘境（tombrun）：残影挑战之上的分层副本 ----
# /zhujian tombrun（别名 mijing）：付门票进入「秘境试炼」，在身边连续刷 waves 定义的
# 若干波残影守卫（守卫档案复用剑冢残影：随机一条被埋剑决定生物/等级/品质，mult 乘血量与攻击），
# 全部波次清算即通关，发 reward 剑币 + 残页；超时 / 死亡 / 退服 / 跑太远 / 放弃判负，门票不退。
tombrun:
  enabled: true                  # 是否开放秘境试炼
  ticket-coins: 300              # 门票（剑币，0 = 免费）
  waves:                         # 波次表：count = 每波守卫只数，mult = 血量/攻击倍率
    - count: 2
      mult: 0.8
    - count: 3
      mult: 1.0
    - count: 4
      mult: 1.3
  reward:
    coins: 800                   # 通关奖励剑币
    pages: 2                     # 通关奖励残页（fm_torn_page，可在剑冢挑战时抵挑战费）
  timeout-seconds: 180           # 试炼总时限（秒），到点强制判负
  spawn-radius: 3                # 守卫生成半径
  leave-radius: 40               # 玩家离起跑点超过这个距离算跑远
  away-seconds: 10               # 跑远/守卫失踪多少秒后判负
  level-per-level: 0.08          # 每级强化：守卫血量与攻击 +8%
  attack-scale: 0.55             # 原剑攻击折算到守卫身上的系数
  max-health: 400                # 守卫血量上限（mult 放大后的兜底）
  max-attack: 40                 # 守卫攻击上限

# ---- 名人堂盔甲架陈列（w7-env E1）----
# 在指定位置生成 Top N 盔甲架，显示玩家名、最佳分与称号。
# 位置由 /zhujian halloffame set（需 forgemaster.admin）写入 location。
# 关服与重载时会清理残留盔甲架。
hall-of-fame:
  enabled: true                  # 是否开启名人堂陈列
  size: 10                       # 展示前几名（最多 10）
  refresh-seconds: 300           # 刷新间隔（秒），刷新时按最新排行重生成盔甲架
  location:                      # 陈列位置，未设置时功能不生效
    world: ""                    # 世界名，由 /zhujian halloffame set 写入
    x: 0.0
    y: 64.0
    z: 0.0
  strengthen:                    # v2.5：「最高锻造等级」条目
    enabled: true                # 是否登记该条目
    min-level: 1                 # 低于该等级不登记（防 +1 占位）
    broadcast: true              # 刷新全服纪录时播报
    show-row: true               # 陈列里是否多摆一排「强化之巅」
# ---- 名人殿堂（拓展第一档）----
# /zhujian hall set（管理员）把脚下设为殿堂原点，写入 hall.yml 的 shrine 段；
# 前三名用 ItemDisplay 平躺摆在原点 / 左 1.5 / 右 1.5，头顶 TextDisplay 名牌。
# 数据源：按历史最高分的前三名；没有任何锻造记录时回退为强化榜前三。
hall:
  enabled: true                  # 是否开启殿堂展示
  refresh-seconds: 30            # 重刷间隔（秒）：只在殿堂区块已加载时清旧补新
# ---- PlaceholderAPI 桥（拓展第一档）----
# 装了 PlaceholderAPI 且 enabled=true 时，反射挂载 %forgemaster_*% 占位符：
#   coins / reputation / title / top_quality / top_score / strengthen / forge_count / forbidden
# 没装 PAPI 时整段静默跳过，不影响其它功能。
placeholder:
  enabled: true                  # 占位符桥开关
